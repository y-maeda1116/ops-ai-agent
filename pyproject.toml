[project]
name = "ops-ai-agent"
version = "0.1.0"
description = "LLM & RAG-powered incident triage and log analysis agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "slack-bolt>=1.20",
    "websocket-client>=1.8",
]

[project.scripts]
ops-agent = "ops_ai_agent.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.1.0",
    "pip-audit>=2.9.0",
    "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88
# docs/ は計画・設計ドキュメント（埋め込みコードブロックを整形対象にしない）
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # テストのassertはpytestの標準的な記法
"ops_ai_agent/cli.py" = ["B008"]  # typer.Option をデフォルト引数に使う標準イディオム

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 実APIを使うテスト（CIではスキップ）",
]
